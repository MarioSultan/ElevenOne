# ==========================================================================
# ElevenOne — Scientific Python Library
# Spectral Laboratory documentation
# ==========================================================================

site_name: ElevenOne
site_description: A scientific Python library for physical quantities, units, data and visualization
site_author: Mario Sultan Romero
site_url: https://elevenone.readthedocs.io/

repo_name: ElevenOne
repo_url: https://github.com/MarioSultan/ElevenOne
edit_uri: edit/main/docs/


# ---------- Theme ----------

theme:
  name: material
  language: en

  # Brand assets
  # Place your logo at docs/assets/logo.png
  logo: assets/logo.png
  favicon: assets/logo.png

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - navigation.footer

    - search.suggest
    - search.highlight

    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github


# ---------- Navigation ----------

nav:
  - Home: index.md

  - Getting started:
      - Introduction: introduction_to_elevenone.md
      - Installation: installation.md
      - Quick start: quick_start_guide.md

  - Physical quantities and units:
      - Basic usage: basic_usage.md
      - Quantities, units and uncertainties: quantities_units_and_uncertainties.md
      # - Unit packages: unit_packages.md
      # - Physical constants: physical_constants.md

  - Data:
      - Data structures: data_structures.md
      - Load data: load_data.md
      - Operations: operations.md

  - Plotting:
      - Line plot: plot.md
      - Scatter plot & linear fitting: scatter.md
      - Explicit errorbar plot: errorbar.md
      - Bar charts: bar.md
      - Histogram: hist.md
      - Boxplot: boxplot.md
      - Violin density plot: violin.md
      - Regression residual plot: residual_plot.md
      - Multivariate pairwise grid: pairplot.md
      - Correlation matrix heatmap: corr_heatmap.md
      - Plots customization: customization.md

  - Automated scientific reports:
      - Report generator: report.md

  - Data fitting:
      - Data fit and fir results: fitting.md
      - Linear fit: fit_linear.md
      - Polynomial fit: fit_polynomial.md
      - Exponential fit: fit_exponential.md
      - Power law fit: fit_power_law.md
      - Logarithmic fit: fit_logarithmic.md
      - Custom fit: fit_custom.md


# ---------- Custom styling ----------

extra_css:
  - stylesheets/extra.css


# ---------- Markdown extensions ----------

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - tables


# ---------- JavaScript ----------

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


# ---------- Footer ----------

copyright: "© 2026 Mario Sultan · ElevenOne" 
